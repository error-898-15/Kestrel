name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDSTREAM_COMMIT: a28e6468f54cfe420feebd205d3d21d08ed0cde8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore CloudStream local-m2
        id: cache-m2
        uses: actions/cache/restore@v4
        with:
          path: local-m2
          key: cloudstream-lib-${{ env.CLOUDSTREAM_COMMIT }}

      - name: Publish pinned CloudStream library
        if: steps.cache-m2.outputs.cache-hit != 'true'
        run: bash scripts/fetch-cloudstream-lib.sh || (sleep 20 && bash scripts/fetch-cloudstream-lib.sh)

      - name: Save CloudStream local-m2
        if: steps.cache-m2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: local-m2
          key: cloudstream-lib-${{ env.CLOUDSTREAM_COMMIT }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build Debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -nE "^e: |What went wrong|Execution failed|Caused by|FAILURE:" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Run Unit Tests
        shell: bash
        run: gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log

      - name: Run Lint
        shell: bash
        run: gradle lintDebug --no-daemon 2>&1 | tee lint.log

      - name: Upload test and lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lint-logs
          path: |
            test.log
            lint.log
          if-no-files-found: ignore
